<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nguyễn Thị Thuỳ Linh – Danh thiếp điện tử</title>
<meta name="theme-color" content="#0a3c8f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@1,400;1,600;1,800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#06265f; --blue:#0a3c8f; --sky:#3d8bfd; --ice:#e6f0ff; --white:#fff;
  --font:"Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{background:var(--blue)}
body{
  font-family:var(--font);font-style:italic;color:var(--white);min-height:100vh;
  background:linear-gradient(170deg,#1c63d1 0%,#0a3c8f 45%,#06265f 100%) fixed;
  padding:max(20px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
  display:flex;justify-content:center;
}
.card{width:100%;max-width:420px}
.photo{
  width:78%;margin:0 auto;aspect-ratio:640/808;overflow:hidden;
  border-radius:999px 999px 24px 24px;border:4px solid var(--white);
  box-shadow:0 18px 40px rgba(2,15,50,.45);background:var(--navy);
}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.id{text-align:center;margin-top:22px}
h1{font-size:1.85rem;font-weight:800;line-height:1.2}
.role{margin-top:8px;font-size:1.05rem;font-weight:600}
.role span{display:block;font-weight:400;color:var(--ice);margin-top:2px}
.tagline{
  margin:20px 0 0;text-align:center;font-size:1.15rem;font-weight:600;
  padding:14px 18px;background:rgba(255,255,255,.12);border-radius:16px;
}
.contacts{margin-top:22px;display:grid;gap:10px}
.row{
  display:flex;align-items:center;gap:14px;padding:14px 16px;
  background:var(--white);color:var(--navy);text-decoration:none;border-radius:16px;
  font-size:.97rem;font-weight:600;line-height:1.35;overflow-wrap:anywhere;
}
.row svg{flex:none;width:22px;height:22px;fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row:focus-visible,.save:focus-visible{outline:3px solid #ffd23f;outline-offset:3px}
.qr{margin-top:22px;text-align:center}
.qr img{width:200px;max-width:70%;border-radius:18px;border:6px solid var(--white);background:var(--white);display:block;margin:0 auto}
.qr p{margin-top:10px;color:var(--ice);font-size:.9rem}
.save{
  margin-top:26px;width:100%;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:1.05rem;
  padding:17px;border-radius:999px;background:#ffd23f;color:var(--navy);
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 10px 24px rgba(2,15,50,.35);transition:transform .15s;
}
.save:active{transform:scale(.97)}
.save svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.toast{margin-top:12px;text-align:center;font-size:.9rem;color:var(--ice);min-height:1.3em}
@media (prefers-reduced-motion:reduce){.save{transition:none}}
</style>
</head>
